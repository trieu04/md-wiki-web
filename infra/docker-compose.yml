name: mdwiki-web

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mdwiki
      POSTGRES_USER: mdwiki
      POSTGRES_PASSWORD: mdwiki-local
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mdwiki -d mdwiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
