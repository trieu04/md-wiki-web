[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdwiki-worker"
version = "0.1.0"
description = "Background worker for the reviewed Markdown wiki"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "bullmq>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
