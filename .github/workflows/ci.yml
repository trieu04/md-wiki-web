name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    # build, lint, typecheck, unit + API integration tests (ping round trip needs postgres, redis and the worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mdwiki
          POSTGRES_USER: mdwiki
          POSTGRES_PASSWORD: mdwiki-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mdwiki -d mdwiki"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/worker
      - run: pnpm build
      - run: pnpm --filter @md-wiki/api exec prisma migrate deploy
      - run: pnpm check
      - run: pnpm contracts:check

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mdwiki
          POSTGRES_USER: mdwiki
          POSTGRES_PASSWORD: mdwiki-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mdwiki -d mdwiki"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: |
          set -a; . ./.env; set +a
          pnpm --filter @md-wiki/api exec prisma migrate deploy
          pnpm --filter @md-wiki/api test -- wiki-read.integration.test.ts

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  tooling:
    # tools/dev.py launcher and Makefile tests (local-engine mode, no SSH tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MW_DOCKER_HOST: ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pytest pytest -q ../../tools/tests
        working-directory: services/worker
