<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #14161B; width: 100%; box-sizing: border-box; min-height: 56px; padding: 8px 20px; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
  <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; color: #14161B; text-decoration: none">
    <span style="width: 28px; height: 28px; border-radius: 7px; background: #14161B; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 1.15"><strong style="font-size: 14px">md-wiki</strong><span style="font-size: 12px; color: #545B68">Bioimaging core</span></span>
  </a>

  <nav aria-label="Wiki" style="display: flex; gap: 2px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
      <a href="{{ l.href }}" aria-current="{{ l.current }}" style="{{ l.style }}">{{ l.label }}</a>
    </sc-for>
  </nav>

  <form role="search" style="flex: 1 1 280px; max-width: 560px; display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 38px; box-sizing: border-box; border: 1px solid #D5D9E0; border-radius: 9px; background: #F6F7F9">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545B68" stroke-width="1.8" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16.5 16.5 21 21"></path></svg>
    <label for="wiki-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search the wiki</label>
    <input id="wiki-search" type="search" value="{{ query }}" placeholder="Search pages, methods, instruments" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; color: #14161B; outline-offset: 4px">
    <span style="font-size: 12px; color: #545B68">⌘K</span>
  </form>

  <div style="margin-left: auto; display: flex; align-items: center; gap: 6px">
    <sc-if value="{{ showWork }}" hint-placeholder-val="{{ true }}">
      <a href="Inbox.dc.html" aria-current="{{ workCurrent }}" style="{{ workStyle }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 2h5l1.5-2h5"></path><path d="M5.5 5h13L21 13v6H3v-6z"></path></svg>
        Workspace
        <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #14161B; color: #FFFFFF; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">4</span>
      </a>
    </sc-if>
    <button type="button" aria-label="Notifications, 2 new" style="position: relative; width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #3A404C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6zM10 19a2 2 0 0 0 4 0"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: #C25A0A; border: 2px solid #FFFFFF"></span>
    </button>
    <a href="You.dc.html" aria-label="You: followed pages and your activity" aria-current="{{ youCurrent }}" style="{{ youStyle }}">{{ initials }}</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","browse","recent","search","you","workspace","none"],"default":"home"},"query":{"editor":"text","default":""},"role":{"editor":"enum","options":["page author","reader"],"default":"page author"},"$preview":{"width":1440,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const role = this.props.role ?? 'page author';
    const defs = [ { id: 'home', label: 'Home', href: 'Main.dc.html' }, { id: 'browse', label: 'Browse', href: 'Page.dc.html' }, { id: 'recent', label: 'Recent changes', href: 'Main.dc.html#recent' } ];
    const links = defs.map(l => {
      const on = l.id === active;
      return { ...l, current: on ? 'page' : 'false',
        style: 'padding: 8px 10px; border-radius: 7px; text-decoration: none; color: ' + (on ? '#14161B' : '#3A404C') + '; background: ' + (on ? '#EEF1F6' : 'transparent') + '; font-weight: ' + (on ? '600' : '500') };
    });
    const w = active === 'workspace';
    const y = active === 'you';
    return {
      links, query: this.props.query ?? '', showWork: role !== 'reader',
      workCurrent: w ? 'page' : 'false',
      workStyle: 'display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: #14161B; font-weight: ' + (w ? '600' : '500') + '; background: ' + (w ? '#EEF1F6' : 'transparent') + '; border: 1px solid ' + (w ? '#D5D9E0' : 'transparent'),
      youCurrent: y ? 'page' : 'false',
      youStyle: 'width: 34px; height: 34px; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 12px; font-weight: 600; color: #1C42AE; background: #E7ECFA; box-shadow: ' + (y ? '0 0 0 2px #FFFFFF, 0 0 0 4px #2453D6' : 'none'),
      initials: role === 'reader' ? 'LT' : 'MN'
    };
  }
}
</script>
</body>
</html>
